[config]
reload_apps = false
contrast = 0
prefer = "saturation"
type = "SchemeFidelity"

[config.custom_colors]
ansi_red     = { color = "#e06c75", blend = true }
ansi_green   = { color = "#98c379", blend = true }
ansi_yellow  = { color = "#e5c07b", blend = true }
ansi_blue    = { color = "#61afef", blend = true }
ansi_magenta = { color = "#c678dd", blend = true }
ansi_cyan    = { color = "#56b6c2", blend = true }

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell-colors.qml'
output_path = '~/.cache/quickshell/Colors.qml'

[templates.hyprland-colors]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"

[templates.qutebrowser]
input_path = '~/.config/matugen/templates/qutebrowser-colors.json'
output_path = '~/.cache/matugen/qutebrowser-colors.json'
post_hook = "sh -c 'pgrep -x qutebrowser >/dev/null && qutebrowser :config-source'"

[templates.nvim]
input_path = "~/.config/matugen/templates/nvim-colors.lua"
output_path = "~/.cache/nvim/colors.lua"
post_hook = 'pkill -SIGUSR1 nvim'

[templates.foot]
input_path = "~/.config/matugen/templates/foot-colors.ini"
output_path = "~/.config/foot/colors.ini"

[templates.fish-colors]
input_path = "~/.config/matugen/templates/fish-colors.fish"
output_path = "~/.cache/fish/matugen-colors.fish"
post_hook = 'pkill -SIGUSR1 fish'

[templates.sequences]
input_path = "~/.config/matugen/templates/sequences.txt"
output_path = "~/.cache/matugen/sequences"
post_hook = "~/.config/matugen/broadcast-sequences.sh"

[templates.zathura]
input_path = "~/.config/matugen/templates/zathura-colors.conf"
output_path = "~/.cache/zathura/colors.zathurarc"
post_hook = "~/.local/bin/zathura-reload"

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi-flavor.toml'
output_path = '~/.config/yazi/flavors/matugen.yazi/flavor.toml'

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.qt5ct]
input_path = "~/.config/matugen/templates/qt5ct-colors.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt5ct-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch-colors.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"

[templates.papirus-accent]
input_path = "~/.config/matugen/templates/papirus-accent.txt"
output_path = "~/.cache/matugen/papirus-accent"
post_hook = "~/.local/bin/papirus-recolor"

[templates.greetd]
input_path = "~/.config/matugen/templates/greetd-regreet.css"
output_path = "/etc/greetd/regreet.css"
