[app]
overall = { bg = "{{ colors.background.default.hex }}" }

[mgr]
cwd             = { fg = "{{ colors.primary.default.hex }}" }
find_keyword    = { fg = "{{ colors.tertiary.default.hex }}", italic = true }
find_position   = { fg = "{{ colors.secondary.default.hex }}", bg = "reset", italic = true }
symlink_target  = { fg = "{{ colors.outline.default.hex }}" }
marker_copied   = { fg = "{{ colors.tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}" }
marker_cut      = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.error.default.hex }}" }
marker_marked   = { fg = "{{ colors.secondary.default.hex }}", bg = "{{ colors.secondary.default.hex }}" }
marker_selected = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
count_copied    = { fg = "{{ colors.on_tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}" }
count_cut       = { fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}" }
count_selected  = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
border_symbol   = "│"
border_style    = { fg = "{{ colors.outline_variant.default.hex }}" }

[indicator]
parent  = { fg = "{{ colors.outline.default.hex }}" }
current = { fg = "{{ colors.primary.default.hex }}" }
preview = { fg = "{{ colors.outline.default.hex }}" }

[tabs]
active    = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
inactive  = { fg = "{{ colors.on_surface_variant.default.hex }}", bg = "{{ colors.surface_container.default.hex }}" }
sep_inner = { open = " ", close = " " }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
normal_alt  = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }
select_main = { fg = "{{ colors.on_tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}", bold = true }
select_alt  = { fg = "{{ colors.tertiary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }
unset_main  = { fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}", bold = true }
unset_alt   = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

[status]
overall         = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.surface_container.default.hex }}" }
sep_left        = { open = "", close = "" }
sep_right       = { open = "", close = "" }
perm_type       = { fg = "{{ colors.primary.default.hex }}" }
perm_read       = { fg = "{{ colors.tertiary.default.hex }}" }
perm_write      = { fg = "{{ colors.error.default.hex }}" }
perm_exec       = { fg = "{{ colors.secondary.default.hex }}" }
perm_sep        = { fg = "{{ colors.outline.default.hex }}" }
progress_label  = { fg = "{{ colors.on_surface.default.hex }}", bold = true }
progress_normal = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }
progress_error  = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

[which]
cols            = 3
mask            = { bg = "{{ colors.surface_container.default.hex }}" }
cand            = { fg = "{{ colors.tertiary.default.hex }}" }
rest            = { fg = "{{ colors.outline.default.hex }}" }
desc            = { fg = "{{ colors.primary.default.hex }}" }
separator       = " -> "
separator_style = { fg = "{{ colors.outline_variant.default.hex }}" }

[confirm]
border  = { fg = "{{ colors.primary.default.hex }}" }
title   = { fg = "{{ colors.primary.default.hex }}" }
body    = { fg = "{{ colors.on_surface.default.hex }}" }
list    = { fg = "{{ colors.on_surface.default.hex }}" }
btn_yes = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
btn_no  = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

[spot]
border   = { fg = "{{ colors.primary.default.hex }}" }
title    = { fg = "{{ colors.primary.default.hex }}" }
tbl_col  = { fg = "{{ colors.tertiary.default.hex }}" }
tbl_cell = { reversed = true }

[notify]
title_info  = { fg = "{{ colors.primary.default.hex }}" }
title_warn  = { fg = "{{ colors.secondary.default.hex }}" }
title_error = { fg = "{{ colors.error.default.hex }}" }

[pick]
border   = { fg = "{{ colors.primary.default.hex }}" }
active   = { fg = "{{ colors.primary.default.hex }}" }
inactive = { fg = "{{ colors.on_surface.default.hex }}" }

[input]
border   = { fg = "{{ colors.primary.default.hex }}" }
title    = { fg = "{{ colors.on_surface.default.hex }}" }
value    = { fg = "{{ colors.on_surface.default.hex }}" }
selected = { reversed = true }

[cmp]
border   = { fg = "{{ colors.outline.default.hex }}" }
active   = { fg = "{{ colors.primary.default.hex }}" }
inactive = { fg = "{{ colors.on_surface_variant.default.hex }}" }

[tasks]
border  = { fg = "{{ colors.primary.default.hex }}" }
title   = { fg = "{{ colors.on_surface.default.hex }}" }
hovered = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }

[help]
on          = { fg = "{{ colors.tertiary.default.hex }}" }
run         = { fg = "{{ colors.on_surface.default.hex }}" }
desc        = { fg = "{{ colors.on_surface_variant.default.hex }}" }
hovered     = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
footer      = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.surface_container.default.hex }}" }

[filetype]
rules = [
  { mime = "image/*", fg = "{{ colors.tertiary.default.hex }}" },
  { mime = "{audio,video}/*", fg = "{{ colors.secondary.default.hex }}" },
  { mime = "inode/empty", fg = "{{ colors.outline.default.hex }}" },
  { url = "*", is = "orphan", fg = "{{ colors.error.default.hex }}" },
  { url = "*/", fg = "{{ colors.primary.default.hex }}" },
]
