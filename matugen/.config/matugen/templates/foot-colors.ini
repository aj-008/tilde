bright2={{ colors.ansi_green.default.hex_stripped | lighten: 12 }}
bright3={{ colors.ansi_yellow.default.hex_stripped | lighten: 12 }}
bright4={{ colors.ansi_blue.default.hex_stripped | lighten: 12 }}
bright5={{ colors.ansi_magenta.default.hex_stripped | lighten: 12 }}
