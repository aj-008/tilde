general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

source = ~/.cache/wal/colors-hyprland.conf

background {
    monitor =
    path = /etc/greetd/wallpaper.jpg
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.72
    vibrancy = 0.18
    vibrancy_darkness = 0.0
}

# Clock 
label {
    monitor =
    text = cmd[update:1000] printf "$(date +'%H:%M')"
    color = $color7
    font_size = 200
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.9)
}

# Day/Date 
label {
    monitor =
    text = cmd[update:60000] printf "$(date +'%A,  %B %d  %Y')"
    color = $color6
    font_size = 26
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.9)
}

# Input
input-field {
    monitor =
    size = 380, 52
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.28
    dots_center = true
    outer_color = $color4
    inner_color = $color0
    font_color = $color7
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    placeholder_text = <span foreground="##ffffff55" font="13">password</span>
    hide_input = false
    rounding = 8
    check_color = $color10
    fail_color = $color9
    fail_text = incorrect
    position = 0, -240
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.6)
}
